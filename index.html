<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .home-hero {
            min-height: min(760px, calc(100svh - 56px));
            position: relative;
            display: flex;
            align-items: center;
            overflow: hidden;
            background: #193b3c;
            color: #fff;
        }

        .home-hero img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .home-hero::before {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: rgba(12, 31, 32, 0.48);
            content: "";
        }

        .home-hero-content {
            position: relative;
            z-index: 2;
            max-width: 720px;
            padding-top: 5rem;
            padding-bottom: 5rem;
        }

        .home-hero h1 {
            max-width: 650px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 4rem;
            line-height: 1.05;
        }

        .home-hero .lead {
            max-width: 540px;
        }

        .hero-link {
            color: #173537;
            background: #f0b35d;
            border-color: #f0b35d;
        }

        .hero-link:hover,
        .hero-link:focus {
            color: #173537;
            background: #ffd18c;
            border-color: #ffd18c;
        }

        @media (max-width: 575.98px) {
            .home-hero h1 {
                font-size: 2.8rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top" aria-label="Main navigation">
        <div class="container">
            <a class="navbar-brand" href="index.html">katebangira Warren</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavigation">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about-me.html">About Me</a></li>
                    <li class="nav-item"><a class="nav-link" href="gallary.html">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contacts</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main>
        <section class="home-hero" aria-labelledby="hero-title">
            <img src="warren2.jpeg" alt="my photo">
            <div class="container home-hero-content">
                <p class="text-uppercase fw-semibold mb-3">My story · My world</p>
                <h1 id="hero-title" class="display-2 fw-normal mb-4">Welcome to My Website</h1>
                <p class="lead mb-4">A little about me, the things I enjoy, and moments worth sharing.</p>
                <div class="d-flex flex-wrap gap-3">
                    <a class="btn hero-link btn-lg" href="about-me.html">About Me</a>
                    <a class="btn btn-outline-light btn-lg" href="gallary.html">View Gallery</a>
                </div>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</html>
